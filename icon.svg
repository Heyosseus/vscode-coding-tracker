<!-- SVG icon for Laravel Coding Time Tracker -->
<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#FF2D20" stroke="#E53E3E" stroke-width="4"/>
  
  <!-- Clock face -->
  <circle cx="64" cy="64" r="35" fill="white" stroke="#2D3748" stroke-width="2"/>
  
  <!-- Clock hands -->
  <!-- Hour hand pointing to 10 -->
  <line x1="64" y1="64" x2="54" y2="40" stroke="#2D3748" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand pointing to 2 -->
  <line x1="64" y1="64" x2="80" y2="45" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="3" fill="#2D3748"/>
  
  <!-- Laravel L symbol -->
  <path d="M64 95 L52 95 L52 105 L76 105 L76 100 L64 100 Z" fill="white"/>
  
  <!-- Code brackets -->
  <text x="20" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="white">&lt;/&gt;</text>
  <text x="85" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="white">&lt;/&gt;</text>
  
  <!-- Timer dots -->
  <circle cx="30" cy="64" r="2" fill="#68D391"/>
  <circle cx="98" cy="64" r="2" fill="#68D391"/>
  <circle cx="64" cy="30" r="2" fill="#68D391"/>
  <circle cx="64" cy="98" r="2" fill="#68D391"/>
</svg>